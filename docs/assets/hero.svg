<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">KJDraw</title>
  <desc id="desc">KJDraw brand banner with an original precision-grid and CAD geometry composition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset=".58" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#102b3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bdfb72"/>
      <stop offset="1" stop-color="#4ee8c2"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(-7)">
      <path d="M72 0H0V72" fill="none" stroke="#8cb1c9" stroke-opacity=".13"/>
      <path d="M18 0V72M36 0V72M54 0V72M0 18H72M0 36H72M0 54H72" fill="none" stroke="#8cb1c9" stroke-opacity=".04"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#01050a" flood-opacity=".55"/>
    </filter>
    <clipPath id="frame"><rect width="1440" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1440" height="360" fill="url(#bg)"/>
    <rect width="1440" height="360" fill="url(#grid)"/>
    <path d="M-70 295 430 212l18 108-500 84z" fill="#18305b" opacity=".78"/>
    <path d="m1080-80 270 0-94 520H986z" fill="#102c42"/>
    <path d="m1260-70 116 0-94 500h-116z" fill="url(#accent)"/>

    <g transform="translate(88 87)" filter="url(#shadow)">
      <path d="M0 0h156v156H0z" fill="url(#accent)"/>
      <g fill="none" stroke="#071522" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M39 34v88M119 34 59 78l60 44M92 56v44"/>
      </g>
      <circle cx="59" cy="78" r="9" fill="#071522"/>
    </g>

    <text x="294" y="225" fill="#f5f9fc" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="142" font-weight="900" letter-spacing="7">KJDRAW</text>

    <g transform="translate(1112 61)" fill="none" stroke="#a8c9da" stroke-width="2" opacity=".72">
      <circle cx="86" cy="116" r="70"/>
      <circle cx="86" cy="116" r="37"/>
      <circle cx="86" cy="116" r="8" fill="#a8c9da"/>
      <path d="M86 26v180M-4 116h180" stroke-dasharray="10 8"/>
      <circle cx="86" cy="63" r="8"/><circle cx="139" cy="116" r="8"/><circle cx="86" cy="169" r="8"/><circle cx="33" cy="116" r="8"/>
      <path d="M16 220h140M16 233h96"/>
    </g>

    <path d="M292 267h620" stroke="url(#accent)" stroke-width="5"/>
    <path d="m912 267-18-10v20z" fill="#4ee8c2"/>
  </g>
</svg>
