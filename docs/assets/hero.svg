<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">KJDraw engineering banner</title><desc id="desc">Abstract CAD linework combining a mechanical detail, a geological section, and structured drawing geometry.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111b"/><stop offset=".58" stop-color="#0d1a28"/><stop offset="1" stop-color="#13283a"/></linearGradient>
  <radialGradient id="glow" cx=".58" cy=".48" r=".68"><stop stop-color="#397fa7" stop-opacity=".25"/><stop offset="1" stop-color="#07101a" stop-opacity="0"/></radialGradient>
  <pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8bb0c6" stroke-opacity=".065"/></pattern>
  <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#8bb0c6" stroke-opacity=".11"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02070d" flood-opacity=".6"/></filter>
</defs>
<rect width="1440" height="520" rx="20" fill="url(#bg)"/><rect width="1440" height="520" rx="20" fill="url(#glow)"/><rect width="1440" height="520" rx="20" fill="url(#minor)"/><rect width="1440" height="520" rx="20" fill="url(#major)"/>

<!-- KJDraw mark -->
<g transform="translate(70 65)" filter="url(#shadow)">
  <rect width="94" height="94" rx="22" fill="#bcf878"/>
  <g fill="none" stroke="#17251b" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"><path d="M25 23v48M70 23 35 47l35 24M55 34v27"/></g>
  <circle cx="35" cy="47" r="6" fill="#17251b"/>
</g>

