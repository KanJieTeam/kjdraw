name: Benchmark replay
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/audits/requirements-dxf.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r scripts/audits/requirements-dxf.txt
      - run: npm run typecheck
      - run: npm run check
      - run: python scripts/benchmarks/deepseek-drawing-pilot.py --self-test
      - run: python scripts/benchmarks/deepseek-multiturn-pilot.py --self-test --schema production
      - run: node --test packages/kjdraw-sdk/test/agent-annotated-tool.test.mjs packages/kjdraw-sdk/test/paired-model-benchmark.test.mjs
      - name: Replay saved model outputs without an API key or model calls
        run: |
          mkdir -p "$RUNNER_TEMP/kjdraw-benchmark-replay"
          unzip -q docs/benchmarks/evidence/2026-09-28-deepseek-flash/oneshot-json-corrected.zip -d "$RUNNER_TEMP/kjdraw-benchmark-replay"
          python scripts/benchmarks/replay-oneshot-study.py "$RUNNER_TEMP/kjdraw-benchmark-replay" --assert-original
          mkdir -p "$RUNNER_TEMP/kjdraw-engineering-replay"
          unzip -q docs/benchmarks/evidence/2026-09-28-deepseek-flash/engineering-zerobased-rerun.zip -d "$RUNNER_TEMP/kjdraw-engineering-replay"
          node scripts/benchmarks/replay-annotated-engineering.mjs "$RUNNER_TEMP/kjdraw-engineering-replay" --assert-original
          mkdir -p "$RUNNER_TEMP/kjdraw-engineering-layer-replay"
          unzip -q docs/benchmarks/evidence/2026-09-28-deepseek-flash/engineering-layer-default-rerun.zip -d "$RUNNER_TEMP/kjdraw-engineering-layer-replay"
          node scripts/benchmarks/replay-annotated-engineering.mjs "$RUNNER_TEMP/kjdraw-engineering-layer-replay" --assert-original
