name: Release provenance audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Bind this audit to the exact current main checks
        id: exact-main
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$sha"

          ci_conclusion=""
          pages_conclusion=""
          for attempt in $(seq 1 30); do
            ci_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion // ""')"
            pages_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?head_sha=$sha&event=push&per_page=20" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion // ""')"
            if [[ "$ci_conclusion" == "success" && "$pages_conclusion" == "success" ]]; then break; fi
            for result in "CI:$ci_conclusion" "Pages:$pages_conclusion"; do
              conclusion="${result#*:}"
              if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" ]]; then
                echo "::error::Exact-main ${result%%:*} concluded $conclusion for $sha"
                exit 1
              fi
            done
            sleep 30
          done
          test "$ci_conclusion" = "success"
          test "$pages_conclusion" = "success"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ci=$ci_conclusion" >> "$GITHUB_OUTPUT"
          echo "pages=$pages_conclusion" >> "$GITHUB_OUTPUT"
      - name: Build and verify candidate release artifacts without publishing
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          node scripts/build-declarations.mjs --check
          node --no-warnings scripts/build-typescript.mjs --check
          node scripts/audits/verify-packed-package.mjs
          mkdir -p dist/release-candidate
          asset="$(npm pack --workspace packages/kjdraw-sdk --pack-destination dist/release-candidate --silent | tail -n 1)"
          node scripts/release-artifacts.mjs "dist/release-candidate/$asset"
          node scripts/audits/verify-release-artifacts.mjs dist/release-candidate
      - name: Attest the verified candidate artifacts
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release-candidate/SHA256SUMS
      - name: Record exact-main audit evidence
        shell: bash
        env:
          AUDIT_SHA: ${{ steps.exact-main.outputs.sha }}
          AUDIT_CI: ${{ steps.exact-main.outputs.ci }}
          AUDIT_PAGES: ${{ steps.exact-main.outputs.pages }}
          ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir -p dist/provenance-audit
          cp "$ATTESTATION_BUNDLE" dist/provenance-audit/provenance.sigstore.json
          while read -r digest name; do
            test -n "$digest"
            gh attestation verify "dist/release-candidate/$name" --repo "$GITHUB_REPOSITORY"
          done < dist/release-candidate/SHA256SUMS | tee dist/provenance-audit/verification.txt
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; const evidence={schema:"com.kanjie.kjdraw.audit.release-provenance@1",repository:process.env.GITHUB_REPOSITORY,commit:process.env.AUDIT_SHA,ref:process.env.GITHUB_REF,run:{id:process.env.GITHUB_RUN_ID,attempt:Number(process.env.GITHUB_RUN_ATTEMPT)},checks:{ci:process.env.AUDIT_CI,pages:process.env.AUDIT_PAGES},attestation:{id:process.env.ATTESTATION_ID,url:process.env.ATTESTATION_URL},published:false}; writeFileSync("dist/provenance-audit/exact-main.json",`${JSON.stringify(evidence,null,2)}\n`)'
      - name: Upload candidate provenance audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-${{ steps.exact-main.outputs.sha }}-${{ github.run_attempt }}
          path: |
            dist/release-candidate/
            dist/provenance-audit/
          if-no-files-found: error
          retention-days: 30
