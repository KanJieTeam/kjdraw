name: Deploy playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 25
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/audits/requirements-dxf.txt
      - run: npm ci --ignore-scripts
      - name: Install Chromium for deployed-site verification
        run: npx playwright install --with-deps chromium
      - run: ${{ steps.setup-python.outputs.python-path }} -m pip install -r scripts/audits/requirements-dxf.txt
      - run: npm run typecheck
      - run: node scripts/build-declarations.mjs --check
      - run: node scripts/build-docs-site.mjs
      - name: Generate current API docs for deployment
        run: node scripts/build-api-docs.mjs
      - name: Run SDK and fixture tests
        env:
          KJDRAW_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: node scripts/test.mjs
      - run: node scripts/check.mjs
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Verify the deployed workbench and documentation match this commit
        shell: bash
        env:
          DEPLOYED_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 10); do
            if node scripts/audits/verify-live-site.mjs "$DEPLOYED_SITE_URL"; then
              exit 0
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "::error::The deployed Pages site did not match or pass the exact candidate checkout after $attempt attempts."
              exit 1
            fi
            sleep 15
          done
