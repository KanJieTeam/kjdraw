name: Publish SDK to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release package
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          node scripts/build-declarations.mjs --check
          node scripts/build-api-docs.mjs --check
          node scripts/test.mjs
          node --no-warnings scripts/build-typescript.mjs --check
          node scripts/audits/verify-packed-package.mjs
          node scripts/check.mjs
          version="$(node -p "require('./packages/kjdraw-sdk/package.json').version")"
          test "$(git rev-list -n 1 "v${version}")" = "$GITHUB_SHA"
          npm pack --dry-run --workspace packages/kjdraw-sdk
      - name: Publish with the correct distribution tag
        run: |
          version="$(node -p "require('./packages/kjdraw-sdk/package.json').version")"
          tag="latest"
          [[ "$version" == *-* ]] && tag="next"
          npm publish --workspace packages/kjdraw-sdk --access public --tag "$tag" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
