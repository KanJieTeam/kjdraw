name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Publish exact tagged package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          tag="$(git tag --points-at "$sha" --sort=-version:refname | head -n 1)"
          test -n "$tag" || { echo "No release tag points at $sha."; exit 0; }
          git checkout --detach "$tag"

          version="${tag#v}"
          notes="docs/releases/${version}.md"
          title="KJDraw ${version}"
          [[ "$version" == *-* ]] && title+=" — Release Candidate"
          args=("$tag" --verify-tag --title "$title")
          [[ "$version" == *-* ]] && args+=(--prerelease)
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          npm ci --ignore-scripts
          npm run typecheck
          node scripts/build-declarations.mjs --check
          node scripts/build-api-docs.mjs --check
          node scripts/test.mjs
          node --no-warnings scripts/build-typescript.mjs --check
          node scripts/audits/verify-packed-package.mjs
          node scripts/check.mjs
          node scripts/audits/release-readiness.mjs --require-ready
          mkdir -p dist/release
          asset="$(npm pack --workspace packages/kjdraw-sdk --pack-destination dist/release --silent | tail -n 1)"
          node scripts/release-artifacts.mjs "dist/release/$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "${args[@]}" dist/release/*
          fi
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS
