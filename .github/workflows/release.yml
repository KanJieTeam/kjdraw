name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish exact tagged package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          tag="$(git tag --points-at "$sha" --sort=-version:refname | head -n 1)"
          test -n "$tag" || { echo "No release tag points at $sha."; exit 0; }
          git checkout --detach "$tag"

          version="${tag#v}"
          notes="docs/releases/${version}.md"
          args=("$tag" --verify-tag --title "KJDraw ${version} — Developer Preview")
          [[ "$version" == *-* ]] && args+=(--prerelease)
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          mkdir -p dist/release
          asset="$(npm pack --workspace packages/kjdraw-sdk --pack-destination dist/release --silent | tail -n 1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/release/$asset" --clobber
          else
            gh release create "${args[@]}" "dist/release/$asset"
          fi
