name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bind release to package, annotated tag, CI and Pages
        shell: bash
        run: |
          version="$(node -p "require('./packages/kjdraw-sdk/package.json').version")"
          test "$RELEASE_TAG" = "v${version}"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$sha"
          git merge-base --is-ancestor "$sha" origin/main

          ci_conclusion=""
          pages_conclusion=""
          for attempt in $(seq 1 30); do
            ci_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion // ""')"
            pages_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?head_sha=$sha&event=push&per_page=20" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion // ""')"
            if [[ "$ci_conclusion" == "success" && "$pages_conclusion" == "success" ]]; then break; fi
            for result in "CI:$ci_conclusion" "Pages:$pages_conclusion"; do
              workflow="${result%%:*}"
              conclusion="${result#*:}"
              if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" ]]; then
                echo "Exact main $workflow concluded $conclusion for $sha"
                exit 1
              fi
            done
            sleep 30
          done
          if [[ "$ci_conclusion" != "success" || "$pages_conclusion" != "success" ]]; then
            echo "Exact main checks did not complete successfully for $sha (CI=$ci_conclusion, Pages=$pages_conclusion)."
            exit 1
          fi
      - name: Verify and package the exact tagged SDK
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          node scripts/build-declarations.mjs --check
          node scripts/build-docs-site.mjs --check
          node scripts/build-api-docs.mjs --check
          node scripts/test.mjs
          node --no-warnings scripts/build-typescript.mjs --check
          node scripts/audits/verify-packed-package.mjs
          node scripts/check.mjs
          node scripts/audits/release-readiness.mjs --require-ready
          mkdir -p dist/release
          asset="$(npm pack --workspace packages/kjdraw-sdk --pack-destination dist/release --silent | tail -n 1)"
          node scripts/release-artifacts.mjs "dist/release/$asset"
      - name: Publish GitHub release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/releases/${version}.md"
          title="KJDraw ${version}"
          args=("$RELEASE_TAG" --verify-tag --title "$title")
          if [[ "$version" == *-* ]]; then
            title+=" — Release Candidate"
            args=("$RELEASE_TAG" --verify-tag --title "$title" --prerelease)
          fi
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" == "true" ]]; then
              echo "::error::GitHub release $RELEASE_TAG already exists as a draft. Review and publish or delete that draft manually, then rerun; this workflow will not publish an existing draft automatically."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
            gh release create "${args[@]}" dist/release/*
          fi
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS

  npm:
    needs: publish
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
