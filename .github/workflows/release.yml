name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Publish newest reachable tag once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git tag --merged HEAD --sort=-version:refname | head -n 1)"
          test -n "$tag" || { echo "No reachable release tag."; exit 0; }
          gh release view "$tag" >/dev/null 2>&1 && { echo "$tag is already published."; exit 0; }

          version="${tag#v}"
          notes="docs/releases/${version}.md"
          args=("$tag" --verify-tag --title "KJDraw ${version} — Developer Preview")
          [[ "$version" == *-* ]] && args+=(--prerelease)
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "${args[@]}"
